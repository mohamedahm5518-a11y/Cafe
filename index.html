<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DARABOKA | Café</title>
  <meta name="description" content="DARABOKA Café - Black and Gold luxury coffee experience." />
  <style>
    :root{
      --bg: #0d0d0f;
      --bg-2: #171719;
      --panel: #141416;
      --panel-2: #1b1b1e;
      --gold: #d8ac4a;
      --gold-soft: #f1d490;
      --text: #f7f3ee;
      --muted: #c9c0b1;
      --line: rgba(216,172,74,0.25);
      --shadow: 0 18px 40px rgba(0,0,0,0.35);
      --radius: 20px;
      --max: 1200px;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height:1.6;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      display:block;
      max-width:100%;
    }

    .container{
      width:min(var(--max), calc(100% - 36px));
      margin-inline:auto;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 14px 24px;
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, var(--gold) 0%, #b9882b 100%);
      color:#120d07;
      border-radius: 999px;
      font-weight:700;
      transition: .25s ease;
      box-shadow: 0 10px 25px rgba(216,172,74,.25);
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(216,172,74,.28);
    }

    .btn-light{
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.16);
    }

    .section-tag{
      color: var(--gold-soft);
      text-transform: uppercase;
      letter-spacing: 6px;
      font-size: 12px;
      font-weight:700;
      margin-bottom: 12px;
    }

    .section-title{
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height:1.1;
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: .5px;
    }

    .muted{
      color: var(--muted);
    }

    /* Header */
    header{
      position: sticky;
      top:0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(13, 13, 15, .82);
      border-bottom: 1px solid rgba(255,255,255
